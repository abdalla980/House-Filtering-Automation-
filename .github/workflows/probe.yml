name: probe-kleinanzeigen
# One-off check: does Kleinanzeigen answer GitHub's runners? Manual trigger only.
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Fetch searches and count listings
        run: |
          python - <<'EOF'
          import monitor as m, requests
          for u in m.KLEINANZEIGEN_URLS:
              r = requests.get(u, headers=m.HEADERS, timeout=20)
              items = list(m.scrape_kleinanzeigen(u)) if r.ok else []
              print(f"status={r.status_code} bytes={len(r.text)} listings={len(items)} url={u}")
          EOF
