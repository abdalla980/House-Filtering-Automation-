name: housing-monitor
# Each run checks Kleinanzeigen every ~5 minutes for about 5h40m, then starts
# its own successor, so the monitor runs around the clock. (GitHub's own cron
# only fires every few hours in practice; it is kept as a backup that
# restarts the chain if it ever breaks.) Stop it: cancel the running run AND
# disable the workflow, otherwise the backup cron restarts it.
# The seen-listings DB is carried between runs via the Actions cache.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to start the next run and keep the schedule enabled

concurrency:
  group: housing-monitor   # never two runs at once -> no duplicate alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Restore seen listings
        uses: actions/cache/restore@v4
        with:
          path: seen_listings.db
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Check Kleinanzeigen every ~5 minutes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          end=$((SECONDS + 340 * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            python monitor.py --once || echo "check failed, retrying next round"
            sleep $((270 + RANDOM % 60))
          done

      - name: Save seen listings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_listings.db
          key: seen-${{ github.run_id }}

      - name: Prune old caches (keep newest 5)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key seen- --sort created_at --order desc \
            --limit 100 --json id -q '.[5:][].id' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY" || true

      # GitHub pauses scheduled workflows after 60 days without repo activity;
      # re-enabling via the API resets that, so the backup cron never silently stops.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable housing-monitor -R "$GITHUB_REPOSITORY" || true

      # Hand over to the next run (skipped when the run was cancelled on purpose).
      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run housing-monitor -R "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
